name: Build & test BreachSix Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer le SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;34.0.0" > /dev/null || true
      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Générer l'icône du lanceur
        run: |
          set -e
          SRC=../icon-512.png
          test -f "$SRC" || { echo "icon-512.png introuvable à la racine du dépôt"; exit 1; }
          IM=$(command -v magick || command -v convert)
          RES=app/src/main/res
          BG=$(${IM} "$SRC" -format '%[hex:p{4,4}]' info: | cut -c1-6)
          echo "Couleur de fond détectée : #$BG"
          gen() { # dossier taille_legacy taille_foreground
            mkdir -p "$RES/mipmap-$1"
            ${IM} "$SRC" -resize "$2x$2" "$RES/mipmap-$1/ic_launcher.png"
            F=$3; I=$((F*66/100))
            ${IM} "$SRC" -resize "${I}x${I}" -background none -gravity center -extent "${F}x${F}" "$RES/mipmap-$1/ic_launcher_foreground.png"
          }
          gen mdpi 48 108
          gen hdpi 72 162
          gen xhdpi 96 216
          gen xxhdpi 144 324
          gen xxxhdpi 192 432
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/values"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@color/ic_launcher_background"/>' '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <color name=\"ic_launcher_background\">#$BG</color>" '</resources>' > "$RES/values/ic_launcher_background.xml"
          ls -R "$RES" | head -40

      - name: Décoder le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/signing.keystore
            echo "SIGNING_KEYSTORE_PATH=$(pwd)/app/signing.keystore" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK debug (IDs de test AdMob — pour Firebase Test Lab)
        run: gradle assembleDebug

      - name: Build AAB release signé
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle bundleRelease

      - name: Publier l'APK debug (artefact de build)
        uses: actions/upload-artifact@v4
        with:
          name: breachsix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'AAB release (si signé)
        if: ${{ env.HAS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: breachsix-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  firebase-test-lab:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_FIREBASE_TEST_LAB == 'true' }}
    steps:
      - name: Récupérer l'APK debug construit à l'étape précédente
        uses: actions/download-artifact@v4
        with:
          name: breachsix-debug-apk
          path: apk

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Configurer gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Lancer le test sur Firebase Test Lab (Robo, appareil réel virtualisé)
        run: |
          gcloud firebase test android run \
            --type robo \
            --app apk/app-debug.apk \
            --device model=redfin,version=30,locale=fr,orientation=portrait \
            --timeout 5m
